name: Atualizar painel FINEP

on:
  schedule:
    - cron: "23 10 * * *"   # todos os dias às 07:23 (Brasília)
    - cron: "23 22 * * *"   # e às 19:23, como segunda tentativa (opcional)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependência
        run: pip install requests==2.32.3

      - name: Coletar e comparar
        run: python monitor.py

      - name: Registrar nova versão (somente se houve alteração)
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "monitor-finep"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Painel FINEP: coleta de $(TZ=America/Sao_Paulo date +'%d/%m/%Y %H:%M')"
            git push
          else
            echo "Sem alterações no painel."
          fi
